name: Convertir TCX a GPX

on:
  workflow_dispatch: # Esto permite darle a un botón para ejecutarlo a mano

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Conversor
        run: python conversor.py

      - name: Guardar resultado GPX
        uses: actions/upload-artifact@v4
        with:
          name: archivo-gpx-convertido
          path: '*.gpx'
